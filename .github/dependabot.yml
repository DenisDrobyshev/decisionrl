version: 2

updates:
  # Actions first: a stale third-party action is a supply-chain risk in every
  # workflow that uses it, and the bump is almost always safe to take.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps"
    groups:
      dev-tooling:
        patterns: ["ruff", "mypy", "pytest*", "pre-commit", "build", "twine", "hypothesis"]
        dependency-type: development
      docs:
        patterns: ["mkdocs*"]
    ignore:
      # torch and numpy are the two dependencies a user is forced to install,
      # and the benchmark numbers in docs/benchmarks.md were reproduced against
      # specific versions. A bump is a claim that those numbers still hold, so
      # it gets read rather than merged.
      - dependency-name: torch
      - dependency-name: numpy
      # gymnasium's environment semantics have changed across minor releases
      # before, which moves learning-test outcomes rather than breaking a build.
      - dependency-name: gymnasium
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    open-pull-requests-limit: 5

  # The serving image is part of the product: deploy/Dockerfile is what a user
  # runs in production, so its base image ages the same way a dependency does.
  - package-ecosystem: docker
    directory: "/deploy"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps"
