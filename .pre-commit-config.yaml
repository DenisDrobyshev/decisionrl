# Install with: pre-commit install
#
# ruff-format runs here and not in CI on purpose. A hundred and forty-nine files
# predate the formatter; a CI gate would be red on day one, while this hook only
# touches what a commit already changes.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        # Higher than the organisation default of 512: the repository ships
        # reproduced benchmark plots and the exported ONNX policy the serving
        # image is built around, and both are legitimately large.
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace

  - repo: local
    hooks:
      # A checkpoint or a TensorBoard run directory is the output of training,
      # not source. Both are large and neither reproduces from the history.
      - id: reject-training-output
        name: reject checkpoints and run directories
        entry: checkpoints and run logs are training output, not source
        language: fail
        files: (\.(pt|pth|ckpt)$|^runs/|^lightning_logs/)

      # Only the fast tests: the learning and integration suite takes minutes
      # and belongs in CI, not in front of a push.
      - id: pytest-fast
        name: pytest (fast tests only)
        entry: pytest -m "not slow" -q
        language: system
        pass_filenames: false
        stages: [pre-push]
